<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- Primary Meta Tags -->
    <title>SatelliteHR — every HR module, one orbit</title>

      name="description"
      content="SatelliteHR: the multi-tenant HRMS where every configuration is an artifact of one engine — authored once, governed per scope, consumed by every module."

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SatelliteHR — every HR module, one orbit" />
    <meta
      property="og:description"
      content="The multi-tenant HRMS where every configuration is an artifact of one engine."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="SatelliteHR — every HR module, one orbit" />

      property="twitter:description"
      content="The multi-tenant HRMS where every configuration is an artifact of one engine."
    />
